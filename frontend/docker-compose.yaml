name: zebrameter-frontend-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: zebrameter-frontend
    container_name: zebrameter-frontend
    restart: always
    environment:
      NODE_ENV: production
      NUXT_API_BASE: "${NUXT_API_BASE:-http://api:3000}"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      TZ: "${TZ:-Asia/Jakarta}"
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - zebrameter-net

networks:
  zebrameter-net:
    name: zebrameter-net-prod
    external: true
