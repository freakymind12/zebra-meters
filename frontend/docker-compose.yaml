name: zebrameter-frontend-prod

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: zebrameter-frontend
    container_name: zebrameter-frontend
    restart: always
    environment:
      NODE_ENV: production
      NUXT_API_BASE: "${NUXT_API_BASE:-http://api:3000}"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      TZ: "${TZ:-Asia/Jakarta}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - frontend-internal
      - zebrameter-net

  nginx:
    image: nginx:stable-alpine
    container_name: zebrameter-frontend-nginx
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend-internal

networks:
  frontend-internal:
    name: zebrameter-frontend-internal
  zebrameter-net:
    name: zebrameter-net-prod
    external: true
